<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinAnalyst</title>
<style>
:root{--bg:#f4f5f8;--card:#fff;--ink:#1b2333;--muted:#667085;--line:#e3e6ec;--brand:#2f5bea;--brand-d:#2347c0;--ok:#12805c;--okbg:#e7f6ef;--warn:#b54708;--warnbg:#fff4e5;--bad:#b42318;--badbg:#fdecea;--info:#175cd3;--infobg:#eaf1fe;--grey:#667085;--greybg:#eef0f4}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink)}
a{color:var(--brand);text-decoration:none}a:hover{text-decoration:underline}
header.top{display:flex;align-items:center;gap:22px;padding:12px 28px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-weight:800;font-size:18px;letter-spacing:-.2px;color:var(--ink)}.brand span{color:var(--brand)}
header.top nav{display:flex;gap:6px;flex:1}
header.top nav a{padding:6px 12px;border-radius:8px;color:var(--ink);font-weight:600}
header.top nav a:hover{background:var(--greybg);text-decoration:none}
.conn{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
.conn i{width:8px;height:8px;border-radius:50%;background:var(--grey);display:inline-block}
.conn.ok i{background:var(--ok)}.conn.bad i{background:var(--bad)}
main{max-width:1180px;margin:0 auto;padding:26px 24px 80px}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.3px}h2{font-size:18px;margin:26px 0 10px}h3{font-size:15px;margin:0 0 6px}
.sub{color:var(--muted);margin:0 0 18px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.row.between{justify-content:space-between}.grow{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:8px 14px;border-radius:9px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{background:var(--greybg);text-decoration:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}.btn.primary:hover{background:var(--brand-d)}
.btn.danger{color:var(--bad);border-color:#f4c7c3}.btn.danger:hover{background:var(--badbg)}
.btn.small{padding:4px 10px;font-size:13px;border-radius:7px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.badge{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:700;background:var(--greybg);color:var(--grey);white-space:nowrap}
.badge.ok,.badge.succeeded,.badge.complete{background:var(--okbg);color:var(--ok)}
.badge.running{background:var(--infobg);color:var(--info)}
.badge.waiting,.badge.awaiting_finance_approval,.badge.awaiting_swot_review{background:var(--warnbg);color:var(--warn)}
.badge.failed,.badge.blocked,.badge.rejected,.badge.bad{background:var(--badbg);color:var(--bad)}
.badge.pending,.badge.skipped,.badge.cancelled{background:var(--greybg);color:var(--grey)}
.bar{height:8px;background:var(--greybg);border-radius:99px;overflow:hidden;min-width:120px}.bar>div{height:100%;background:var(--brand);transition:width .4s}
.bar.done>div{background:var(--ok)}
.muted{color:var(--muted)}.small{font-size:13px}.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700}
tr:last-child td{border-bottom:0}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:18px 0 18px;overflow-x:auto}
.tab{padding:10px 16px;border:0;background:none;font:inherit;font-weight:600;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;white-space:nowrap}
.tab.active{color:var(--brand);border-bottom-color:var(--brand)}
.tab .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#f79009;margin-left:6px}.tab .dot.red{background:var(--bad)}
.banner{border-radius:12px;padding:14px 18px;margin-bottom:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.banner.warn{background:var(--warnbg);border:1px solid #fedf89}.banner.bad{background:var(--badbg);border:1px solid #f4c7c3}
.banner.ok{background:var(--okbg);border:1px solid #abe3cb}.banner.info{background:var(--infobg);border:1px solid #c5d8fb}
.stage{display:grid;grid-template-columns:22px 1fr auto;gap:4px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.stage:last-child{border-bottom:0}
.sdot{width:14px;height:14px;border-radius:50%;margin-top:4px;background:var(--grey)}
.sdot.succeeded{background:var(--ok)}.sdot.running{background:var(--brand);animation:pulse 1.2s infinite}
.sdot.waiting{background:#f79009}.sdot.failed,.sdot.blocked,.sdot.rejected{background:var(--bad)}.sdot.pending,.sdot.skipped,.sdot.cancelled{background:#cfd4dc}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,91,234,.5)}100%{box-shadow:0 0 0 9px rgba(47,91,234,0)}}
pre.err{grid-column:2/4;background:var(--badbg);color:var(--bad);border-radius:8px;padding:8px 10px;white-space:pre-wrap;word-break:break-word;margin:4px 0 0;font-size:12.5px}
pre.log{background:#0f172a;color:#d6e2ff;padding:14px;border-radius:10px;overflow:auto;max-height:60vh;font-size:12.5px;white-space:pre-wrap}
form.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px 18px}
label.f{display:flex;flex-direction:column;gap:4px;font-weight:600;font-size:13.5px}
label.f small{font-weight:400;color:var(--muted)}
input[type=text],input[type=number],select,textarea{font:inherit;padding:8px 10px;border:1px solid #cfd4dc;border-radius:8px;background:#fff;width:100%}
textarea{min-height:64px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:2px solid #bcd0ff;border-color:var(--brand)}
.files{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px 18px;margin-top:6px}
.drop{border:2px dashed #cfd4dc;border-radius:10px;padding:14px;background:#fafbfc}
.err-banner{background:var(--badbg);color:var(--bad);border:1px solid #f4c7c3;border-radius:10px;padding:10px 14px;margin-bottom:14px;white-space:pre-wrap}
.chip{display:inline-block;padding:1px 8px;border-radius:6px;font-size:12px;font-weight:600;background:var(--greybg);color:var(--grey);margin-right:6px}
.chip.blocking{background:var(--badbg);color:var(--bad)}.chip.decision{background:var(--warnbg);color:var(--warn)}.chip.warning{background:#fffaeb;color:#93370d}.chip.info{background:var(--infobg);color:var(--info)}
.chip.strength{background:var(--okbg);color:var(--ok)}.chip.weakness{background:var(--badbg);color:var(--bad)}.chip.opportunity{background:var(--infobg);color:var(--info)}.chip.threat{background:var(--warnbg);color:var(--warn)}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:10px;margin:6px 0;cursor:pointer}
.opt:hover{background:#fafbfc}.opt.sel{border-color:var(--brand);background:var(--infobg)}
.opt input{margin-top:4px}
.quads{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
.qcol{border-radius:12px;border:1px solid var(--line);background:#fff;padding:14px 16px}
.qcol h3{display:flex;align-items:center;gap:8px}
.qcol.strength{border-top:4px solid var(--ok)}.qcol.weakness{border-top:4px solid var(--bad)}.qcol.opportunity{border-top:4px solid var(--info)}.qcol.threat{border-top:4px solid #f79009}
.item{border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:10px 0;background:#fff}
.item.d-approve{border-left:5px solid var(--ok)}.item.d-edit{border-left:5px solid var(--info)}.item.d-reject{border-left:5px solid var(--bad);opacity:.75}
.item .stmt{font-weight:600;margin:4px 0}
.ev{background:#fafbfc;border-radius:8px;padding:6px 10px;margin:6px 0;font-size:13px;color:#344054}
.ev q{color:#344054}
.seg{display:inline-flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.sticky-bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:12px 24px;margin:20px -24px -80px;display:flex;gap:12px;align-items:center;z-index:10}
.sent{display:inline-block;min-width:54px;text-align:center;padding:2px 8px;border-radius:6px;font-weight:700;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:flex;align-items:center;justify-content:center;z-index:50;padding:24px}
.modal>div{background:#fff;border-radius:14px;max-width:960px;width:100%;max-height:90vh;overflow:auto;padding:18px 20px}
#toast{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:60}
.toast{background:#1b2333;color:#fff;padding:10px 16px;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.2);max-width:420px;white-space:pre-wrap}
.toast.bad{background:var(--bad)}.toast.ok{background:var(--ok)}
details>summary{cursor:pointer;font-weight:600}
.empty{text-align:center;padding:44px 20px;color:var(--muted)}
.kv{display:flex;gap:26px;flex-wrap:wrap}.kv div{min-width:110px}.kv b{display:block;font-size:20px}
.card{overflow-x:auto}
.stmt,.ev,.opt,td,.banner,li,pre.err{overflow-wrap:anywhere}
header.top{flex-wrap:wrap;gap:8px 16px}
@media(max-width:700px){main{padding:18px 14px 80px}header.top{padding:10px 14px}.conn span{display:none}.quads{grid-template-columns:minmax(0,1fr)}.sticky-bar{margin:20px -14px -80px;flex-wrap:wrap}h1{font-size:21px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand">Fin<span>Analyst</span></div>
  <nav><a href="#/">All analyses</a><a href="#/new">New analysis</a></nav>
  <div class="conn" id="conn"><i></i><span>connecting…</span></div>
</header>
<main id="app"></main>
<div id="toast"></div>
<script>

"use strict";
/* ---------- basics ---------- */
const BASE = localStorage.getItem("fa_base") || (location.protocol.startsWith("http") ? "" : "http://127.0.0.1:8000");
const app = document.getElementById("app");

function h(tag, props, ...kids) {
  const el = document.createElement(tag);
  let deferredValue;
  for (const [k, v] of Object.entries(props || {})) {
    if (v === null || v === undefined || v === false) continue;
    if (k === "class") el.className = v;
    else if (k === "text") el.textContent = v;
    else if (k === "value") deferredValue = v;
    else if (k === "checked") el.checked = !!v;
    else if (k === "disabled") el.disabled = !!v;
    else if (k.startsWith("on") && typeof v === "function") el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid === null || kid === undefined || kid === false) continue;
    el.append(kid instanceof Node ? kid : document.createTextNode(String(kid)));
  }
  if (deferredValue !== undefined) el.value = deferredValue;
  return el;
}
function safeUrl(u) {
  try { const x = new URL(u); return (x.protocol === "http:" || x.protocol === "https:") ? x.href : null; } catch (e) { return null; }
}
function link(url, text) {
  const s = safeUrl(url);
  return s ? h("a", { href: s, target: "_blank", rel: "noopener noreferrer" }, text || s) : h("span", {}, text || "");
}
function apiUrl(path) { return BASE + path; }
function fileUrl(jobId, rel) { return apiUrl(`/jobs/${jobId}/files/${rel.split("/").map(encodeURIComponent).join("/")}`); }

class ApiError extends Error { constructor(status, message) { super(message); this.status = status; } }
function detailText(d) {
  if (typeof d === "string") return d;
  if (Array.isArray(d)) return d.map(x => (x.loc ? x.loc.filter(p => p !== "body").join(".") + ": " : "") + (x.msg || JSON.stringify(x))).join("\n");
  return JSON.stringify(d);
}
async function api(path, opts) {
  let r;
  try { r = await fetch(apiUrl(path), opts); } catch (e) { setConn(false); throw new ApiError(0, "Cannot reach the backend. Is it running?"); }
  setConn(true);
  const ct = r.headers.get("content-type") || "";
  const body = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new ApiError(r.status, body && body.detail ? detailText(body.detail) : (typeof body === "string" ? body.slice(0, 300) : "Request failed"));
  return body;
}
function postJson(path, data) {
  return api(path, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data) });
}
function setConn(ok) {
  const c = document.getElementById("conn");
  c.className = "conn " + (ok ? "ok" : "bad");
  c.lastChild.textContent = ok ? "backend connected" : "backend not reachable";
}
function toast(msg, kind) {
  const t = h("div", { class: "toast " + (kind || "") }, msg);
  document.getElementById("toast").append(t);
  setTimeout(() => t.remove(), kind === "bad" ? 9000 : 4000);
}
function fail(e) { toast(e && e.message ? e.message : String(e), "bad"); }

/* ---------- formatting ---------- */
const PCT = new Set(["operating_margin", "net_margin", "gross_margin", "revenue_growth", "net_income_growth", "ppe_share_of_assets", "inventory_share_of_assets", "debt_ratio", "equity_ratio", "retained_earnings_to_equity"]);
const fmtMetric = (m, v) => v === null || v === undefined ? "n/a" : (PCT.has(m) ? (v * 100).toFixed(1) + "%" : v.toFixed(2) + "x");
const fmtNum = v => v === null || v === undefined ? "—" : Number(v).toLocaleString("en-US", { maximumFractionDigits: 2 });
const fmtTime = iso => iso ? new Date(iso).toLocaleString() : "";
function fmtDur(a, b) {
  if (!a) return "";
  const s = Math.max(0, Math.round(((b ? new Date(b) : new Date()) - new Date(a)) / 1000));
  return s < 60 ? s + "s" : Math.floor(s / 60) + "m " + (s % 60) + "s";
}
const cap = s => s ? s[0].toUpperCase() + s.slice(1) : s;
const humanize = s => String(s || "").replace(/_/g, " ");
const STATUS_LABEL = { running: "Working", awaiting_finance_approval: "Needs your approval", awaiting_swot_review: "Ready for your review", complete: "Complete", failed: "Failed", blocked: "Blocked", cancelled: "Cancelled" };
const STAGE_LABEL = { finance_preview: "Read the financial statements", finance_approve: "Your approval of the financials", discovery: "Find recent news", triage: "Pick the key events", resolve: "Find the original articles", verify: "Open and check the pages", sentiment: "Score the articles", swot_build: "Draft the SWOT", swot_review: "Your SWOT review" };
const stageLabel = n => n.startsWith("rca_") ? "Root-cause analysis #" + n.split("_")[1] : (STAGE_LABEL[n] || n);
function stageDetail(s) {
  const m = s.meta || {};
  switch (s.name) {
    case "finance_preview": return m.proposal_status ? `Proposal: ${humanize(m.proposal_status)}, ${m.periods} periods` : "";
    case "finance_approve": return m.periods ? `${m.periods} periods approved` : "";
    case "discovery": return m.articles ? `${m.articles} articles found` : "";
    case "triage": return m.selected_events ? `${m.selected_events} key events selected` : "";
    case "resolve": return m.resolved != null ? `${m.resolved} links resolved, ${m.failed || 0} failed` : "";
    case "verify": {
      if (m.verified_articles == null) return "";
      const skipped = Object.entries(m.statuses || {}).filter(([k]) => k !== "ok").map(([k, v]) => `${v} ${humanize(k)}`);
      return `${m.verified_articles} pages verified` + (skipped.length ? ` (skipped: ${skipped.join(", ")})` : "");
    }
    case "sentiment": return m.quality && m.quality.llm_scored != null ? `${m.quality.llm_scored} articles scored by the AI` : "";
    case "swot_build": { const c = Object.values(m.companies || {})[0]; return c ? `${c.items} proposals drafted` : ""; }
    case "swot_review": { const c = Object.values(m.summary || {})[0]; return c ? `${c.pending} still pending, ${c.rejected} rejected` : ""; }
    default: return "";
  }
}
const stageMap = job => Object.fromEntries(job.stages.map(s => [s.name, s]));
const badge = (status, text) => h("span", { class: "badge " + status }, text || STATUS_LABEL[status] || cap(humanize(status)));

/* ---------- state & routing ---------- */
const S = { token: 0, timer: null };
function stopPolling() { S.token++; clearTimeout(S.timer); }
function poll(fn, msFn) {
  const tok = ++S.token;
  (async function loop() {
    if (tok !== S.token) return;
    try { await fn(); } catch (e) { /* connection state is shown in the header */ }
    if (tok === S.token) S.timer = setTimeout(loop, msFn());
  })();
}
function route() {
  stopPolling();
  const hash = location.hash.replace(/^#/, "") || "/";
  const m = hash.match(/^\/job\/([0-9a-f]{10})(?:\/(\w+))?$/);
  if (m) return showJob(m[1], m[2]);
  if (hash === "/new") return showNew();
  return showList();
}
window.addEventListener("hashchange", route);

/* ---------- job list ---------- */
async function showList() {
  app.replaceChildren(h("h1", {}, "Analyses"), h("p", { class: "sub" }, "Every company you have analysed. Open one to continue where you left off."), h("div", { id: "list" }));
  const draw = async () => {
    const jobs = await api("/jobs?limit=100");
    const box = document.getElementById("list");
    if (!box) return;
    if (!jobs.length) {
      box.replaceChildren(h("div", { class: "card empty" }, h("p", {}, "No analyses yet."), h("a", { class: "btn primary", href: "#/new" }, "Start the first one")));
      return;
    }
    const rows = jobs.map(j => h("tr", {},
      h("td", {}, h("a", { href: "#/job/" + j.id }, h("b", {}, j.company)), h("div", { class: "muted small" }, j.objective || "")),
      h("td", {}, badge(j.status)),
      h("td", {}, h("div", { class: "bar" + (j.progress >= 1 ? " done" : "") }, h("div", { style: `width:${Math.round(j.progress * 100)}%` }))),
      h("td", { class: "muted small" }, fmtTime(j.created_at)),
      h("td", {}, h("a", { class: "btn small", href: "#/job/" + j.id }, "Open"))));
    box.replaceChildren(h("div", { class: "card" }, h("table", {}, h("thead", {}, h("tr", {}, ["Company", "Status", "Progress", "Started", ""].map(x => h("th", {}, x)))), h("tbody", {}, rows))));
  };
  poll(draw, () => 5000);
}

/* ---------- new analysis ---------- */
function showNew() {
  const err = h("div", { class: "err-banner", style: "display:none" });
  const field = (label, name, hint, props) => h("label", { class: "f" }, label, h("input", Object.assign({ type: "text", name }, props || {})), hint ? h("small", {}, hint) : null);
  const sel = (label, name, opts, hint) => h("label", { class: "f" }, label, h("select", { name }, opts.map(([v, t]) => h("option", { value: v }, t))), hint ? h("small", {}, hint) : null);
  const form = h("form", { class: "card" },
    h("div", { class: "grid" },
      field("Company *", "company", "e.g. General Motors", { required: true, maxlength: 120 }),
      field("Question this analysis should answer", "objective", "e.g. Assess expansion readiness", { maxlength: 500 }),
      field("Stock ticker", "ticker", "optional, e.g. GM"),
      field("Compare with (listed companies)", "peers_tickers", "optional; tickers separated by commas, e.g. AMZN, MSFT. Their numbers come from their SEC filings", { maxlength: 120 }),
      field("Places to focus on", "location", "optional; separate several with ;  (empty = worldwide)"),
      field("Other names used in headlines", "alias", "optional; separate with ;"),
      field("Ignore headlines containing", "exclude", "optional; helps with look-alike names; separate with ;"),
      h("label", { class: "f" }, "News period (days)", h("input", { type: "number", name: "days", value: "30", min: "1", max: "90" })),
      sel("Units of the statements", "units", [["unknown", "Not sure"], ["units", "Plain units"], ["thousands", "Thousands"], ["millions", "Millions"], ["billions", "Billions"]]),
      field("Currency", "currency", "optional, e.g. USD", { maxlength: 10 }),
      sel("Statement frequency", "frequency", [["auto", "Detect automatically"], ["annual", "Annual"], ["quarterly", "Quarterly"]]),
      field("Scope of the statements", "entity", 'optional, e.g. "consolidated group"')),
    h("h3", { style: "margin-top:18px" }, "Financial statements (CSV)"),
    h("p", { class: "muted small" }, "Upload both files, or neither (the SWOT then uses news only). First column = line items, other columns = periods."),
    h("div", { class: "files" },
      h("label", { class: "f drop" }, "Balance sheet", h("input", { type: "file", name: "balance", accept: ".csv" })),
      h("label", { class: "f drop" }, "Income statement", h("input", { type: "file", name: "income", accept: ".csv" })),
      h("label", { class: "f drop" }, "Peer benchmarks (optional JSON)", h("input", { type: "file", name: "peers", accept: ".json" }))),
    h("label", { class: "row", style: "margin-top:16px" }, h("input", { type: "checkbox", name: "no_llm" }), h("span", {}, "Test run without AI calls (keyword scoring only; news will not appear in the SWOT)")),
    h("div", { class: "row", style: "margin-top:18px" }, h("button", { class: "btn primary", type: "submit" }, "Start analysis"), h("a", { class: "btn", href: "#/" }, "Cancel")));
  form.addEventListener("submit", async ev => {
    ev.preventDefault();
    err.style.display = "none";
    const fd = new FormData();
    for (const el of form.elements) {
      if (!el.name || el.type === "file" || el.type === "checkbox" || el.type === "submit") continue;
      if (el.value.trim() !== "") fd.append(el.name, el.value.trim());
    }
    fd.append("no_llm", form.elements.no_llm.checked ? "true" : "false");
    const files = ["balance", "income", "peers"].map(n => [n, form.elements[n].files[0]]);
    const has = Object.fromEntries(files.map(([n, f]) => [n, !!f]));
    if (has.balance !== has.income) { err.textContent = "Upload both the balance sheet and the income statement, or neither."; err.style.display = "block"; return; }
    files.forEach(([n, f]) => { if (f) fd.append(n, f); });
    const btn = form.querySelector("button[type=submit]");
    btn.disabled = true; btn.textContent = "Starting…";
    try {
